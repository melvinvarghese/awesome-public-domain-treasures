name: Link audit
on:
  schedule:
    - cron: '0 6 1 1,4,7,10 *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Check item and rights URLs
        run: python scripts/check_external_links.py --output "$RUNNER_TEMP/link-audit.json"
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: link-audit
          path: ${{ runner.temp }}/link-audit.json
